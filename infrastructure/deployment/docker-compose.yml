version: '3.8'

services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/deployment/Dockerfile.web
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NODE_ENV=production

  api:
    build:
      context: ../..
      dockerfile: infrastructure/deployment/Dockerfile.api
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3000
